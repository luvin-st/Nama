<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5ec">
<title>Offline · Nama'</title>
<style>
  :root { --ground:#f2f5ec; --card:#ffffff; --ink:#10241b; --muted:#5d6f64; --primary:#0f3d2e; --on-primary:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ground:#0b1510; --card:#16231c; --ink:#eaf2e6; --muted:#9fb3a6; --primary:#d7f26a; --on-primary:#10241b; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; background:var(--ground); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { width:100%; max-width:440px; padding:24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:20px; }
  img { width:88px; height:88px; border-radius:20px; }
  h1 { margin:0; font-size:22px; }
  p { margin:8px 0 0; font-size:15px; line-height:1.4; color:var(--muted); }
  button { width:100%; height:52px; border:0; border-radius:14px; background:var(--primary); color:var(--on-primary); font-size:17px; font-weight:600; font-family:inherit; cursor:pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Nama'">
  <div>
    <h1>You're offline</h1>
    <p>Nama' needs a connection to show your points and drops. Check your Wi-Fi or mobile data, then try again.</p>
  </div>
  <button type="button" onclick="location.reload()">Try Again</button>
</main>
</body>
</html>
